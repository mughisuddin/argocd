apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: application-01
spec:
  destination:
    namespace: default
    server: https://kubernetes.default.svc
  project: default
  source: 
    helm:
      releaseName: application-from-helm
    path: nginx
    repoURL: https://github.com/mughisuddin/argocd.git 
    targetRevision: main
